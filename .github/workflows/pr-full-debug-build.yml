name: Enhanced TV verification

on:
  push:
    branches: [codex/enhanced-tv-fire-hd]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enhanced-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_USE_DEBUG_SIGNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare local build configuration
        run: |
          touch local.properties local.dev.properties
          chmod +x gradlew
      - name: Verify and build
        run: ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.ui.screens.settings.MemoryBudgetTest' --tests 'com.nuvio.tv.core.performance.*' --tests 'com.nuvio.tv.core.livetv.*' --tests 'com.nuvio.tv.ui.screens.detail.RandomEpisodePolicyTest' --tests 'com.nuvio.tv.core.tmdb.TmdbMetadataServiceTest' :app:assembleFullDebug --stacktrace
      - name: Save preview APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-tv-fire-hd-preview
          path: |
            app/build/outputs/apk/full/debug/*armeabi-v7a*.apk
            app/build/reports/tests/testFullDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
